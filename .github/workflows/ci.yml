name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[api,dev,xlsx]"
      - run: ruff check src tests scripts
      - run: pytest --cov --cov-report=term-missing --cov-fail-under=70
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: docker build -t delta-t-doctor .
      - name: Smoke test (read-only filesystem, no capabilities)
        run: |
          docker run -d --name dtd --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --cap-drop ALL --security-opt no-new-privileges -p 8000:8000 delta-t-doctor
          for i in $(seq 1 30); do curl -fs localhost:8000/api/health && break || sleep 2; done
          curl -fs localhost:8000/api/health | grep '"status":"ok"'
          curl -fs "localhost:8000/api/demo/fouled_coils" | grep -q '"findings"'
          curl -fs "localhost:8000/api/demo/fouled_coils.csv" -o demo.csv
          curl -fs -F "file=@demo.csv" localhost:8000/api/diagnose | grep -q '"provenance"'
