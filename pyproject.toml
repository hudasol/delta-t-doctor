[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deltat-doctor"
version = "0.5.0"
description = "Diagnose why district-cooled buildings pay low delta-T surcharges, using only utility meter data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "joblib>=1.3",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "httpx>=0.27", "matplotlib>=3.8"]

[project.scripts]
deltat-doctor = "deltat_doctor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deltat_doctor = ["assets/*", "web/*", "web/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
