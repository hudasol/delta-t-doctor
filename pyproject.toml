[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deltat-doctor"
version = "1.3.0"
description = "Diagnose why district-cooled buildings pay low delta-T surcharges, using only utility meter data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.9,<1.10",   # the bundled model loads only with the scikit-learn minor it was trained with
  "joblib>=1.3",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]
xlsx = ["openpyxl>=3.1"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "httpx>=0.27", "matplotlib>=3.8"]

[project.scripts]
deltat-doctor = "deltat_doctor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deltat_doctor = ["assets/*", "web/*", "web/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "E701", "E702", "E741", "B008", "B905", "E401", "E402", "E731", "B007", "B904", "B023"]

[tool.coverage.run]
source = ["src/deltat_doctor"]
omit = ["src/deltat_doctor/sim/*"]
